<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ReSpace launch film script workspace.">
  <title>{% block title %}Scripts{% endblock %} · ReSpace</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body class="format-page">
  <header class="format-header">
    <div class="format-header-inner">
      <a class="format-brand" href="{{ url_for('scripts') }}"><strong>ReSpace</strong></a>
      <span class="format-header-title">Launch film</span>
    </div>
  </header>
  {% block body %}{% endblock %}
  {% block extra_scripts %}{% endblock %}
</body>
</html>
