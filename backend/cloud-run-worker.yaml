# Replace placeholders and verify available Gemini model IDs before deployment.
# IAM must grant run.invoker only to Tasks/Scheduler identities; no allUsers binding.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: respace-worker
  labels:
    cloud.googleapis.com/location: REGION
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'false'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '5'
    spec:
      serviceAccountName: respace-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 240
      containers:
        - image: IMAGE_URI
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
          env:
            - name: RESPACE_SERVICE_ROLE
              value: worker
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: respace-database-url
                  key: latest
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: respace-gemini-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: respace-gemini-key
                  key: latest
            - name: PERCEPTRON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: respace-perceptron-key
                  key: latest
            - name: SERPAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: respace-serpapi-key
                  key: latest
            - name: CAPTURE_BUCKET
              value: PRIVATE_BUCKET_NAME
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: CLOUD_TASKS_LOCATION
              value: REGION
            - name: CLOUD_TASKS_QUEUE
              value: respace-continuations
            - name: WORKER_URL
              value: https://WORKER_SERVICE.run.app
            - name: TASKS_SERVICE_ACCOUNT
              value: respace-tasks@PROJECT_ID.iam.gserviceaccount.com
            - name: GEMINI_PLANNING_MODEL
              value: VERIFIED_MODEL_ID
            - name: GEMINI_EXTRACTION_MODEL
              value: VERIFIED_MODEL_ID
            - name: GEMINI_SPATIAL_MODEL
              value: VERIFIED_MODEL_ID
            - name: GEMINI_EDIT_MODEL
              value: VERIFIED_MODEL_ID
            - name: PERCEPTRON_MODEL
              value: perceptron-mk1.5
