[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "respace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "google-genai>=1,<2",
  "google-cloud-storage>=2.18,<4",
  "google-cloud-tasks>=2.18,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "numpy>=2,<3",
  "shapely>=2,<3",
  "pillow>=11,<13",
  "playwright>=1.49,<2",
  "perceptron>=0.4,<0.5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "mypy>=1.13,<2"]
# Composing room previews (respace.composition). Not needed by the rest of the API.
usd = ["usd-core>=26.5,<27"]

[tool.setuptools.packages.find]
include = ["respace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
