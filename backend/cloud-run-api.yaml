# Replace PROJECT_ID, REGION, IMAGE_URI, PRIVATE_BUCKET_NAME and WORKER_SERVICE.
# Apply only after private worker IAM, queue, Scheduler, secrets and DB exist.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: respace-api
  labels:
    cloud.googleapis.com/location: REGION
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '5'
    spec:
      serviceAccountName: respace-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: IMAGE_URI
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          env:
            - name: RESPACE_SERVICE_ROLE
              value: api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: respace-database-url
                  key: latest
            - name: CAPTURE_BUCKET
              value: PRIVATE_BUCKET_NAME
            - name: GOOGLE_CLOUD_PROJECT
              value: PROJECT_ID
            - name: CLOUD_TASKS_LOCATION
              value: REGION
            - name: CLOUD_TASKS_QUEUE
              value: respace-continuations
            - name: WORKER_URL
              value: https://WORKER_SERVICE.run.app
            - name: TASKS_SERVICE_ACCOUNT
              value: respace-tasks@PROJECT_ID.iam.gserviceaccount.com
